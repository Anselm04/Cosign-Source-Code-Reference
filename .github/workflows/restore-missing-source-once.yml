name: Restore six omitted pinned Cosign Go source files
on:
  push:
    paths:
      - '.github/workflows/restore-missing-source-once.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Restore original omitted files at original Git object identities
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM=6181e75677cc4719e845fa23d0ef8a936e883aa0
          git -c protocol.version=2 fetch -q --depth=1 --filter=blob:none https://github.com/sigstore/cosign.git "$UPSTREAM"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM"
          python3 - <<'PY'
          import subprocess
          files=["cmd/conformance/main.go","pkg/oci/internal/signature/layer.go","pkg/oci/internal/signature/layer_test.go","pkg/signature/annotations.go","pkg/signature/keys.go","pkg/signature/keys_test.go"]
          for p in files:
              exists=subprocess.run(["git","ls-tree","FETCH_HEAD","--",p],capture_output=True,text=True,check=True)
              assert exists.stdout.strip(),p
              subprocess.run(["git","restore","--source=FETCH_HEAD","--staged","--worktree","--",p],check=True)
              subprocess.run(["git","add","-f","--",p],check=True)
              expected=subprocess.check_output(["git","rev-parse","FETCH_HEAD:"+p],text=True).strip()
              actual=subprocess.check_output(["git","rev-parse",":"+p],text=True).strip()
              assert expected==actual,(p,expected,actual)
          print("Restored all six exact upstream Git objects.")
          PY
          mkdir -p .trillionai
          printf '%s\n' '# Cosign source completeness repair' '' 'Restored six originally omitted Go source/test files at upstream commit 6181e75677cc4719e845fa23d0ef8a936e883aa0.' 'Original object identity was verified for every restored file.' 'Upstream CI workflows intentionally excluded.' 'No upstream application or test code was executed.' > .trillionai/SOURCE_COMPLETENESS_REPAIR.md
          rm .github/workflows/restore-missing-source-once.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(reference): restore six exact pinned Cosign Go source files'
          git push origin HEAD:main
