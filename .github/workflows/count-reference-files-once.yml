name: Count tracked Cosign reference files once
on:
  push:
    paths:
      - '.github/workflows/count-reference-files-once.yml'
permissions:
  contents: write
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact Git tracked file count
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .trillionai
          COUNT="$(git ls-files -z | tr -cd '\\0' | wc -c)"
          # Count from git ls-files directly, without a shell substitution on NUL data
          COUNT="$(git ls-files | wc -l)"
          printf 'Tracked files on main before this count record: %s\n' "$COUNT" > .trillionai/FILE_COUNT.txt
          printf 'Source revision: %s\n' "$(git rev-parse HEAD)" >> .trillionai/FILE_COUNT.txt
          rm -f .github/workflows/count-reference-files-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "docs: record verified tracked file count"
          git push origin HEAD:main
